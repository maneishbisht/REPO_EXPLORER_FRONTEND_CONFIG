apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repo-explorer-route
  namespace: repo-explorer-namespace
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: backendservice
          port: 3001
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: frontendservice
          port: 3000